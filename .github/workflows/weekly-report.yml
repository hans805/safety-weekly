name: 주간 안전보건 동향 리포트

# 매주 월요일 07:00(한국시간) 지난주 월~일 대시보드형 리포트를 만들어 사이트에 게시
on:
  schedule:
    - cron: "0 22 * * 0"   # 일요일 22:00 UTC = 월요일 07:00 KST
  workflow_dispatch:
    inputs:
      force:
        description: "이미 있는 주차도 다시 만들기 (사용량 소모)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      skipped: ${{ steps.period.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4

      - name: 보고 주차 계산 (지난주 월~일, 겹침 없음)
        id: period
        env:
          TZ: Asia/Seoul
        run: |
          DOW=$(date +%u)
          FROM=$(date -d "-$((DOW + 6)) days" +%F)
          TO=$(date -d "${FROM} +6 days" +%F)
          WEEK=$(date -d "${FROM}" +%G-W%V)
          echo "WEEK=${WEEK}" >> "$GITHUB_ENV"
          echo "FROM=${FROM}" >> "$GITHUB_ENV"
          echo "TO=${TO}" >> "$GITHUB_ENV"
          echo "보고 주차 ${WEEK} (${FROM} ~ ${TO})"
          if [ -f "docs/reports/${WEEK}.html" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "이미 ${WEEK} 리포트가 있어 생성을 건너뜁니다(사용량 절약)."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.period.outputs.skipped == 'false'
        with:
          node-version: 20

      - name: Claude Code 설치
        if: steps.period.outputs.skipped == 'false'
        run: npm install -g @anthropic-ai/claude-code

      - name: 리포트 데이터 생성 (Claude)
        if: steps.period.outputs.skipped == 'false'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TZ: Asia/Seoul
        run: |
          set -euo pipefail
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN 시크릿이 등록되지 않았습니다."; exit 1
          fi
          python3 scripts/seen_urls.py
          sed -e "s/{{FROM}}/${FROM}/g" -e "s/{{TO}}/${TO}/g" -e "s/{{WEEK}}/${WEEK}/g" prompt-dashboard.md > out/prompt.txt
          cat out/prompt.txt | claude -p \
            --model sonnet \
            --allowedTools "WebSearch,WebFetch,Write,Read" \
            --max-turns 60 \
            --output-format text > out/claude.log 2>&1 || true
          if [ ! -s out/report.json ]; then
            echo "::error::report.json 이 생성되지 않았습니다. 아래 로그를 확인하세요."
            tail -n 60 out/claude.log
            exit 1
          fi

      - name: 리포트 게시 준비
        if: steps.period.outputs.skipped == 'false'
        env:
          TZ: Asia/Seoul
        run: |
          python3 scripts/publish_dashboard.py "$WEEK" "$FROM" "$TO"
          python3 scripts/build_index.py

      - name: 리포트 이력 저장 (커밋)
        if: steps.period.outputs.skipped == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "주간 리포트 ${WEEK}"
          git push

      - uses: actions/configure-pages@v5
        if: steps.period.outputs.skipped == 'false'

      - uses: actions/upload-pages-artifact@v3
        if: steps.period.outputs.skipped == 'false'
        with:
          path: docs

      - name: 실행 로그 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-log
          path: out/claude.log
          retention-days: 14
          if-no-files-found: ignore

  deploy:
    needs: build
    if: needs.build.outputs.skipped == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 업로드 반영 대기
        run: sleep 20

      - id: deploy
        uses: actions/deploy-pages@v4
